spring:
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:29092}
    consumer:
      group-id: recommendation-service-test
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: kz.halyk.maqsat.common.event.MetricsComputed
        spring.json.trusted.packages: kz.halyk.maqsat.common.event
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

# Disable Eureka for tests
eureka:
  client:
    enabled: false

# Disable security JWT validation for tests
spring.autoconfigure.exclude: org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

openai:
  api-key: ""
  base-url: http://localhost:9999
  model: gpt-4o-mini
  max-tokens: 1024
  temperature: 0.3
