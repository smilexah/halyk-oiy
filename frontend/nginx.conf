server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # gzip
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed build assets — cache hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # API → gateway (the only externally-reachable backend entry point).
  # Use a variable + docker's embedded DNS so nginx starts even if the
  # gateway isn't up yet (resolves per-request instead of at boot).
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $upstream http://gateway:8080;
    proxy_pass $upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback — every unknown route serves index.html (fixes deep-link 404s).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
