server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      default-filters:
        - RemoveRequestHeader=Cookie
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: budget-service
          uri: lb://budget-service
          predicates:
            - Path=/api/budget/**
        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/api/transactions/**
        - id: goals-service
          uri: lb://goals-service
          predicates:
            - Path=/api/goals/**
        - id: family-service
          uri: lb://family-service
          predicates:
            - Path=/api/family/**
        - id: ai-assistant-service
          uri: lb://ai-assistant-service
          predicates:
            - Path=/api/ai/**
        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/api/analytics/**
        - id: financial-agent-service
          uri: lb://financial-agent-service
          predicates:
            - Path=/api/financial-agent/**
        - id: parse-budget-plan-service
          uri: lb://parse-budget-plan-service
          predicates:
            - Path=/api/parse-budget/**
        - id: summary-llm-service
          uri: lb://summary-llm-service
          predicates:
            - Path=/api/summary/**
        - id: recommendation-service
          uri: lb://recommendation-service
          predicates:
            - Path=/api/recommendations/**
        - id: alser-mock-service
          uri: lb://alser-mock-service
          predicates:
            - Path=/api/alser/**
        - id: halyk-travel-mock-service
          uri: lb://halyk-travel-mock-service
          predicates:
            - Path=/api/halyk-travel/**
        # Proxy each service's OpenAPI doc so the gateway's Swagger UI can aggregate them.
        - id: openapi-auth
          uri: lb://auth-service
          predicates: [ "Path=/v3/api-docs/auth-service" ]
          filters: [ "RewritePath=/v3/api-docs/auth-service, /v3/api-docs" ]
        - id: openapi-budget
          uri: lb://budget-service
          predicates: [ "Path=/v3/api-docs/budget-service" ]
          filters: [ "RewritePath=/v3/api-docs/budget-service, /v3/api-docs" ]
        - id: openapi-transaction
          uri: lb://transaction-service
          predicates: [ "Path=/v3/api-docs/transaction-service" ]
          filters: [ "RewritePath=/v3/api-docs/transaction-service, /v3/api-docs" ]
        - id: openapi-goals
          uri: lb://goals-service
          predicates: [ "Path=/v3/api-docs/goals-service" ]
          filters: [ "RewritePath=/v3/api-docs/goals-service, /v3/api-docs" ]
        - id: openapi-family
          uri: lb://family-service
          predicates: [ "Path=/v3/api-docs/family-service" ]
          filters: [ "RewritePath=/v3/api-docs/family-service, /v3/api-docs" ]
        - id: openapi-ai
          uri: lb://ai-assistant-service
          predicates: [ "Path=/v3/api-docs/ai-assistant-service" ]
          filters: [ "RewritePath=/v3/api-docs/ai-assistant-service, /v3/api-docs" ]
        - id: openapi-integration
          uri: lb://integration-service
          predicates: [ "Path=/v3/api-docs/integration-service" ]
          filters: [ "RewritePath=/v3/api-docs/integration-service, /v3/api-docs" ]
        - id: openapi-analytics
          uri: lb://analytics-service
          predicates: [ "Path=/v3/api-docs/analytics-service" ]
          filters: [ "RewritePath=/v3/api-docs/analytics-service, /v3/api-docs" ]
        - id: openapi-financial-agent
          uri: lb://financial-agent-service
          predicates: [ "Path=/v3/api-docs/financial-agent-service" ]
          filters: [ "RewritePath=/v3/api-docs/financial-agent-service, /v3/api-docs" ]
        - id: openapi-parse-budget
          uri: lb://parse-budget-plan-service
          predicates: [ "Path=/v3/api-docs/parse-budget-plan-service" ]
          filters: [ "RewritePath=/v3/api-docs/parse-budget-plan-service, /v3/api-docs" ]
        - id: openapi-summary-llm
          uri: lb://summary-llm-service
          predicates: [ "Path=/v3/api-docs/summary-llm-service" ]
          filters: [ "RewritePath=/v3/api-docs/summary-llm-service, /v3/api-docs" ]
        - id: openapi-recommendation
          uri: lb://recommendation-service
          predicates: [ "Path=/v3/api-docs/recommendation-service" ]
          filters: [ "RewritePath=/v3/api-docs/recommendation-service, /v3/api-docs" ]
        - id: openapi-alser
          uri: lb://alser-mock-service
          predicates: [ "Path=/v3/api-docs/alser-mock-service" ]
          filters: [ "RewritePath=/v3/api-docs/alser-mock-service, /v3/api-docs" ]
        - id: openapi-halyk-travel
          uri: lb://halyk-travel-mock-service
          predicates: [ "Path=/v3/api-docs/halyk-travel-mock-service" ]
          filters: [ "RewritePath=/v3/api-docs/halyk-travel-mock-service, /v3/api-docs" ]
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8081/realms/maqsat}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, gateway
  endpoint:
    health:
      show-details: always
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      probability: 1.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    use-root-path: true
    urls:
      - { name: auth-service, url: /v3/api-docs/auth-service }
      - { name: budget-service, url: /v3/api-docs/budget-service }
      - { name: transaction-service, url: /v3/api-docs/transaction-service }
      - { name: goals-service, url: /v3/api-docs/goals-service }
      - { name: family-service, url: /v3/api-docs/family-service }
      - { name: ai-assistant-service, url: /v3/api-docs/ai-assistant-service }
      - { name: integration-service, url: /v3/api-docs/integration-service }
      - { name: analytics-service, url: /v3/api-docs/analytics-service }
      - { name: financial-agent-service, url: /v3/api-docs/financial-agent-service }
      - { name: parse-budget-plan-service, url: /v3/api-docs/parse-budget-plan-service }
      - { name: summary-llm-service, url: /v3/api-docs/summary-llm-service }
      - { name: recommendation-service, url: /v3/api-docs/recommendation-service }
      - { name: alser-mock-service, url: /v3/api-docs/alser-mock-service }
      - { name: halyk-travel-mock-service, url: /v3/api-docs/halyk-travel-mock-service }

logging:
  structured:
    format:
      console: ecs