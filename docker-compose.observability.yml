# Optional observability overlay — Prometheus + Grafana + Loki + Tempo + Alloy.
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up --build
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: maqsat-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver   # accept Tempo's generated service-graph/span metrics
      - --enable-feature=exemplar-storage
    volumes:
      - ./docs/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    networks: [maqsat]

  loki:
    image: grafana/loki:3.2.0
    container_name: maqsat-loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./docs/observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    ports: ["3100:3100"]
    networks: [maqsat]

  tempo:
    image: grafana/tempo:2.6.0
    container_name: maqsat-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./docs/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "3200:3200"   # tempo query
      - "4318:4318"   # otlp http
    networks: [maqsat]

  alloy:
    image: grafana/alloy:v1.4.2
    container_name: maqsat-alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./docs/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports: ["12345:12345"]
    depends_on:
      loki: { condition: service_started }
    networks: [maqsat]

  grafana:
    image: grafana/grafana:11.2.2
    container_name: maqsat-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./docs/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docs/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on:
      prometheus: { condition: service_started }
      loki: { condition: service_started }
      tempo: { condition: service_started }
    networks: [maqsat]